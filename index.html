<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>صفحه اصلی</title>
<script>
/* Runs before the page paints: skip the splash on refresh, and zoom the layout out on phones (drone view) */
(function(){
  try{if(sessionStorage.getItem('seen'))document.documentElement.className+=' skip'}catch(e){}
  if(Math.min(screen.width,screen.height)<600)document.querySelector('meta[name=viewport]').setAttribute('content','width=480, user-scalable=no, viewport-fit=cover');
})();
</script>
<style>
:root{--r:1.7778;--bg1:#10224a;--bg2:#1a3a78;--ink:#fff;--mute:#d6e2fb;--g1:#3a6fd8;--g2:#1c4a9e;--card1:#1f3a72;--card2:#152a57;--field:#0f1f45;--menu1:#1b3568;--menu2:#10224a;--glass1:rgba(255,255,255,.22);--glass2:rgba(255,255,255,.08);--tilebg:#1b3568;--hdr:rgba(16,34,74,.9);--grid:rgba(255,255,255,.06);--b1:#3b82f6;--b2:#1d4ed8;--btnink:#fff;--btnsh:rgba(0,20,80,.45);--bez1:#f4f8ff;--bez2:#9fb4d8;--bez3:#dbe6f8;--bezsh:#4a628f;--safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px)}
html[data-theme=light]{--bg1:#f5f8fe;--bg2:#e4edfb;--ink:#000;--mute:#25314d;--g1:#cfe0ff;--g2:#e9f1ff;--card1:#fff;--card2:#f0f5fd;--field:#fff;--menu1:#fff;--menu2:#e8f0fd;--glass1:rgba(255,255,255,.92);--glass2:rgba(255,255,255,.65);--tilebg:#dbe6f6;--hdr:rgba(245,248,254,.92);--grid:rgba(30,70,160,.06);--b1:#2f6df6;--bez1:#fff;--bez2:#b4c4e0;--bez3:#e6eef9;--bezsh:#8da0c4}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%;touch-action:pan-y;overscroll-behavior-x:none}
body{font-family:Vazirmatn,"IRANSans",Tahoma,sans-serif;font-size:14px;color:var(--ink);overflow-x:hidden;
  background:radial-gradient(1200px 700px at 80% -10%,var(--g1) 0%,transparent 60%),radial-gradient(900px 600px at 0% 100%,var(--g2) 0%,transparent 55%),linear-gradient(160deg,var(--bg1),var(--bg2));background-attachment:fixed}
body.lock{overflow:hidden}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:34px 34px;-webkit-mask-image:radial-gradient(ellipse at 50% 25%,#000,transparent 78%);mask-image:radial-gradient(ellipse at 50% 25%,#000,transparent 78%)}
html.skip #loader{display:none}

/* ---- plastic 3D buttons ---- */
.btn{--c:var(--b1);--d:var(--b2);position:relative;border:0;cursor:pointer;font:inherit;font-weight:800;font-size:13px;color:var(--btnink);padding:8px 14px;border-radius:14px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;overflow:hidden;
  background:linear-gradient(180deg,color-mix(in srgb,var(--c) 70%,#fff),var(--c) 45%,var(--d));
  box-shadow:0 5px 0 color-mix(in srgb,var(--d) 75%,#000),0 10px 16px rgba(0,0,0,.4),inset 0 2px 1px rgba(255,255,255,.7),inset 0 -5px 8px rgba(0,0,0,.25);
  text-shadow:0 2px 3px var(--btnsh);transition:transform .12s,box-shadow .12s,filter .2s}
.btn::before{content:"";position:absolute;inset:3px 8px auto;height:42%;border-radius:14px 14px 30px 30px;background:linear-gradient(180deg,rgba(255,255,255,.6),rgba(255,255,255,.04));pointer-events:none}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 color-mix(in srgb,var(--d) 75%,#000),0 4px 8px rgba(0,0,0,.4),inset 0 2px 1px rgba(255,255,255,.5)}
.gold{--c:#f59e0b;--d:#b45309}.green{--c:#16a34a;--d:#166534}
.btn:focus-visible,.tile:focus-visible,.story:focus-visible{outline:3px solid #fff;outline-offset:2px}

/* ---- header ---- */
header{position:sticky;top:0;z-index:20;padding:calc(6px + var(--safe-t)) 10px 4px;display:flex;align-items:center;justify-content:space-between;backdrop-filter:blur(10px);background:linear-gradient(180deg,var(--hdr),transparent)}
.burger,.tbtn{width:38px;height:38px;padding:0;border-radius:13px;font-size:16px}
.burger{flex-direction:column;gap:5px}
.burger i{display:block;width:20px;height:3px;border-radius:3px;background:var(--btnink);transition:.3s;position:relative;z-index:1}
.burger.open i:nth-child(1){transform:translateY(8px) rotate(45deg)}.burger.open i:nth-child(2){opacity:0}.burger.open i:nth-child(3){transform:translateY(-8px) rotate(-45deg)}
.brand{text-align:center;line-height:1.35}
.logo{font-weight:900;font-size:16px;text-shadow:0 2px 0 var(--g1),0 5px 12px rgba(0,0,0,.25)}
.clock{font-size:10px;color:var(--mute);font-weight:700}

/* ---- stories ---- */
.stories{display:flex;gap:8px;justify-content:space-between;overflow-x:auto;scrollbar-width:none;padding:2px 2px 4px}
.story{flex:1 0 56px;max-width:84px;background:none;border:0;color:var(--ink);font:inherit;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
.ring{width:58px;height:58px;border-radius:50%;padding:3px;background:conic-gradient(#60a5fa,#2563eb,#93c5fd,#60a5fa);box-shadow:0 4px 10px rgba(0,0,0,.3)}
.story.seen .ring{background:#8a94a8}
.ring img{width:100%;height:100%;border-radius:50%;object-fit:cover;border:2px solid var(--bg1);display:block;background:var(--tilebg)}
.sn{font-size:10.5px;font-weight:700;max-width:72px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---- main ---- */
main{max-width:1600px;margin:0 auto;padding:2px 10px calc(78px + var(--safe-b));display:flex;flex-direction:column;gap:8px;min-height:calc(100dvh - 52px)}
.tv-wrap{width:100%;max-width:min(640px,calc(30vh*var(--r) + 24px));margin:0 auto}
.tv{position:relative;border-radius:22px;padding:7px 7px 14px;background:linear-gradient(160deg,var(--bez1),var(--bez2) 55%,var(--bez3));box-shadow:0 14px 24px rgba(0,0,0,.4),0 5px 0 var(--bezsh),inset 0 3px 2px rgba(255,255,255,.35)}
.screen{position:relative;aspect-ratio:16/9;border-radius:16px;overflow:hidden;background:#000;cursor:pointer;box-shadow:inset 0 0 0 3px #0a0818,0 0 24px rgba(59,130,246,.25)}
.screen video{width:100%;height:100%;object-fit:cover;object-position:50% 30%;display:block;pointer-events:none;background:#000}
.screen::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(120deg,rgba(255,255,255,.2),transparent 35%)}
.noV{position:absolute;inset:0;display:none;align-items:center;justify-content:center;color:#9fb4d8;font-size:12px;text-align:center;padding:10px}
.fsi{position:absolute;top:7px;right:7px;z-index:3;width:26px;height:26px;border-radius:8px;background:rgba(10,20,45,.5);color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;backdrop-filter:blur(6px);pointer-events:none}
.screen .snd{position:absolute;bottom:7px;left:7px;z-index:3;width:34px;height:34px;padding:0;border-radius:50%;font-size:15px}
.screen .vback{display:none;position:absolute;top:calc(14px + var(--safe-t));right:14px;z-index:4}
.screen.full{position:fixed;inset:0;z-index:75;width:100%;height:100%;aspect-ratio:auto!important;border-radius:0;box-shadow:none;cursor:default}
.screen.full video{object-fit:contain}
.screen.full::after,.screen.full .fsi{display:none}
.screen.full .vback{display:inline-flex}
.tv-bar{position:absolute;bottom:3px;left:20px;right:20px;display:flex;align-items:center;justify-content:space-between}
.led{width:7px;height:7px;border-radius:50%;background:#22c55e;box-shadow:0 0 8px #22c55e;animation:blink 2s infinite}
@keyframes blink{50%{opacity:.35}}
.col{display:flex;flex-direction:column;gap:8px;flex:1}
.grid{flex:1;min-height:280px;display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:minmax(0,1fr);gap:4px}
.tile{position:relative;border:0;padding:0;cursor:pointer;border-radius:12px;overflow:hidden;background:var(--tilebg);min-height:0;transition:transform .15s}
.tile:first-child{grid-column:span 2;grid-row:span 2}
.tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s}
.tile:active{transform:scale(.97)}
.tile .ph{position:absolute;inset:0;display:none;align-items:center;justify-content:center;font:700 11px ui-monospace,Consolas,monospace;color:var(--mute);direction:ltr;padding:4px;text-align:center}
@media (hover:hover){.tile:hover img{transform:scale(1.06)}}
.adbox{display:none}.adbox.show{display:block}
.ad{position:relative;display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:14px;color:var(--ink);text-decoration:none;background:linear-gradient(90deg,var(--card1),var(--card2));box-shadow:0 4px 10px rgba(0,0,0,.25),inset 0 1px 1px rgba(255,255,255,.3);font-size:13px;font-weight:700;min-height:44px}
.ad img{width:36px;height:36px;border-radius:10px;object-fit:cover}
.adl{font-size:10px;font-weight:800;padding:2px 7px;border-radius:8px;background:#f59e0b;color:#111}

/* ---- dock ---- */
.dock{position:fixed;z-index:25;left:50%;bottom:calc(10px + var(--safe-b));transform:translateX(-50%);display:flex;gap:6px;padding:7px;border-radius:24px;width:calc(100% - 20px);max-width:560px;background:linear-gradient(180deg,var(--glass1),var(--glass2));backdrop-filter:blur(14px);box-shadow:0 12px 26px rgba(0,0,0,.45),inset 0 1px 1px rgba(255,255,255,.5)}
.dock .btn{flex:1;padding:8px 2px;font-size:11px;white-space:nowrap}

/* ---- menu ---- */
.scrim{position:fixed;inset:0;background:rgba(5,10,25,.6);backdrop-filter:blur(4px);opacity:0;pointer-events:none;transition:.3s;z-index:30}.scrim.show{opacity:1;pointer-events:auto}
nav.menu{position:fixed;top:0;right:0;bottom:0;width:min(78vw,300px);z-index:40;padding:calc(70px + var(--safe-t)) 18px 24px;display:flex;flex-direction:column;gap:14px;background:linear-gradient(180deg,var(--menu1),var(--menu2));box-shadow:-20px 0 50px rgba(0,0,0,.5);transform:translateX(105%);transition:transform .45s cubic-bezier(.2,.9,.2,1)}
nav.menu.show{transform:none}nav.menu .btn{width:100%}

/* ---- modals ---- */
.modal{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(5,10,25,.72);backdrop-filter:blur(6px)}
.modal.show{display:flex;animation:pop .3s}
@keyframes pop{from{opacity:0;transform:scale(.94)}}
.card{width:min(100%,400px);border-radius:26px;padding:20px;background:linear-gradient(180deg,var(--card1),var(--card2));color:var(--ink);box-shadow:0 30px 60px rgba(0,0,0,.55),inset 0 2px 1px rgba(255,255,255,.3);display:flex;flex-direction:column;gap:12px}
.card h2{font-size:19px}.card p{color:var(--mute);line-height:2;font-size:14px;white-space:pre-line}
.plans{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.plan{border-radius:18px;padding:12px 8px;background:var(--field);box-shadow:inset 0 2px 6px rgba(0,0,0,.2);display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.plan b{font-size:15px}.plan .pr{font-size:15px;font-weight:900}.plan small{color:var(--mute);font-size:10.5px}
.plan.best{box-shadow:0 0 0 2px #f59e0b,inset 0 2px 6px rgba(0,0,0,.2)}

/* ---- feed (explore viewer) ---- */
.feed{position:fixed;inset:0;z-index:70;background:#000;display:none;color:#fff}.feed.show{display:block;animation:pop .25s}
.fscroll{height:100%;overflow-y:auto;scroll-snap-type:y mandatory;overscroll-behavior:contain;scrollbar-width:none;outline:0}.fscroll::-webkit-scrollbar{display:none}
.post{position:relative;height:100%;scroll-snap-align:start;scroll-snap-stop:always;overflow:hidden;background:#000}
.pbg{position:absolute;inset:-24px;width:calc(100% + 48px);height:calc(100% + 48px);object-fit:cover;filter:blur(26px) brightness(.55)}
.pimg{position:relative;z-index:1;width:100%;height:100%;object-fit:contain}
.pph{position:absolute;inset:0;z-index:1;display:none;align-items:center;justify-content:center;font:700 15px ui-monospace,Consolas,monospace;color:#9fb4d8;direction:ltr}
.rail{position:absolute;z-index:3;left:12px;bottom:calc(96px + var(--safe-b));display:flex;flex-direction:column;gap:16px;align-items:center}
.act{border:0;background:none;color:#fff;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;font:inherit;font-weight:800;font-size:12px;text-shadow:0 1px 6px rgba(0,0,0,.7)}
.act .ic{width:50px;height:50px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(18,28,52,.5);backdrop-filter:blur(8px);box-shadow:inset 0 1px 1px rgba(255,255,255,.4),0 6px 14px rgba(0,0,0,.45);transition:transform .15s}
.act:active .ic{transform:scale(.88)}.act svg{width:26px;height:26px;fill:currentColor}
.like.on .ic{color:#ff3b5c}.like.on svg{animation:beat .35s}@keyframes beat{50%{transform:scale(1.35)}}
.burst{position:absolute;z-index:2;left:50%;top:50%;width:110px;height:110px;margin:-55px 0 0 -55px;color:#ff3b5c;opacity:0;pointer-events:none}
.burst svg{width:100%;height:100%;fill:currentColor;filter:drop-shadow(0 6px 16px rgba(0,0,0,.5))}
.burst.go{animation:burst .8s ease-out}@keyframes burst{0%{opacity:0;transform:scale(.4)}25%{opacity:1;transform:scale(1.1)}70%{opacity:1}100%{opacity:0;transform:scale(1.2)}}
.adbar{position:absolute;z-index:4;left:10px;right:10px;bottom:calc(14px + var(--safe-b))}
.ftop{position:absolute;z-index:5;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:calc(10px + var(--safe-t)) 12px 22px;pointer-events:none;background:linear-gradient(rgba(0,0,0,.55),transparent)}
.ftop>*{pointer-events:auto}#fcnt{font-weight:800;font-size:13px;direction:ltr;text-shadow:0 1px 6px rgba(0,0,0,.7)}
.sheet{position:absolute;inset:0;z-index:8;display:none;align-items:flex-end;background:rgba(0,0,0,.5)}.sheet.show{display:flex}
.sh-card{width:100%;max-width:560px;margin:0 auto;max-height:72%;display:flex;flex-direction:column;border-radius:24px 24px 0 0;background:var(--card1);color:var(--ink);box-shadow:0 -20px 50px rgba(0,0,0,.5);animation:up .3s cubic-bezier(.2,.9,.2,1);padding-bottom:var(--safe-b)}
@keyframes up{from{transform:translateY(100%)}}
.sh-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;font-size:16px;font-weight:800}
.sx{width:34px;height:34px;padding:0;border-radius:11px;font-size:13px}
.clist{overflow:auto;padding:0 16px;flex:1;min-height:90px}
.cm{padding:10px 12px;margin-bottom:8px;border-radius:14px;background:var(--field);line-height:1.8;font-size:14px;word-break:break-word}
.empty{color:var(--mute);text-align:center;padding:22px 0;font-size:14px}
.sh-in{display:flex;gap:8px;padding:12px 16px}
.sh-in input{flex:1;min-width:0;font:inherit;color:var(--ink);padding:11px 14px;border-radius:14px;border:0;background:var(--field);box-shadow:inset 0 2px 6px rgba(0,0,0,.25);outline:0}

/* ---- story viewer ---- */
.sv{position:fixed;inset:0;z-index:72;background:#000;display:none;color:#fff}.sv.show{display:block}
.sv-media{position:absolute;inset:0}.sv-media img,.sv-media video{width:100%;height:100%;object-fit:contain;background:#000;display:none}
.sv-bars{position:absolute;top:calc(8px + var(--safe-t));left:10px;right:10px;display:flex;gap:4px;z-index:3}
.sv-bars i{flex:1;height:3px;border-radius:3px;background:rgba(255,255,255,.3);overflow:hidden}.sv-bars b{display:block;height:100%;width:0;background:#fff}
.sv-top{position:absolute;z-index:4;top:calc(18px + var(--safe-t));left:10px;right:10px;display:flex;align-items:center;justify-content:space-between;font-weight:800;text-shadow:0 1px 6px rgba(0,0,0,.7)}
.sv-hit{position:absolute;inset:64px 0 0;z-index:2;display:flex}.sv-hit button{background:none;border:0;height:100%}

/* ---- broadcast popup ---- */
.bc{position:fixed;inset:0;z-index:85;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(5,10,25,.65);backdrop-filter:blur(6px)}.bc.show{display:flex;animation:pop .3s}
.bc-card{width:min(100%,380px);text-align:center;border-radius:26px;padding:24px 20px;background:linear-gradient(180deg,var(--card1),var(--card2));color:var(--ink);box-shadow:0 30px 60px rgba(0,0,0,.55),inset 0 2px 1px rgba(255,255,255,.3);display:flex;flex-direction:column;gap:12px;align-items:center}
.bc-ic{font-size:36px}.bc-card h2{font-size:19px}.bc-card p{line-height:2;color:var(--mute);font-size:14.5px;white-space:pre-line}

/* ---- loaders ---- */
#loader{position:fixed;inset:0;z-index:100;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:40px;background:radial-gradient(800px 500px at 50% 40%,#1e3a8a,#0b1530);transition:opacity .6s,visibility .6s}
#loader.done{opacity:0;visibility:hidden}
.scene{perspective:600px;width:80px;height:80px}.cube{position:relative;width:100%;height:100%;transform-style:preserve-3d;animation:spin 2.4s linear infinite}
.cube div{position:absolute;inset:0;border-radius:16px;border:2px solid rgba(255,255,255,.7);background:linear-gradient(135deg,rgba(96,165,250,.9),rgba(37,99,235,.9));box-shadow:inset 0 0 18px rgba(255,255,255,.5),0 0 18px rgba(59,130,246,.6)}
.cube div:nth-child(1){transform:translateZ(40px)}.cube div:nth-child(2){transform:rotateY(90deg) translateZ(40px);background:linear-gradient(135deg,rgba(147,197,253,.9),rgba(59,130,246,.9))}
.cube div:nth-child(3){transform:rotateY(180deg) translateZ(40px)}.cube div:nth-child(4){transform:rotateY(-90deg) translateZ(40px);background:linear-gradient(135deg,rgba(30,64,175,.9),rgba(23,37,84,.9))}
.cube div:nth-child(5){transform:rotateX(90deg) translateZ(40px)}.cube div:nth-child(6){transform:rotateX(-90deg) translateZ(40px)}
@keyframes spin{from{transform:rotateX(-20deg) rotateY(0)}to{transform:rotateX(340deg) rotateY(360deg)}}
.track{width:min(60vw,260px);height:18px;border-radius:18px;background:#0c0824;box-shadow:inset 0 3px 6px rgba(0,0,0,.7),0 1px 0 rgba(255,255,255,.2);padding:3px}
.fill{height:100%;width:0;border-radius:18px;background:linear-gradient(180deg,#bfdbfe,#3b82f6 50%,#1d4ed8);box-shadow:0 0 14px rgba(96,165,250,.8)}
#pct{font-weight:900;font-size:18px;margin-top:-24px;direction:ltr}
#nl{position:fixed;inset:0;z-index:90;display:none;flex-direction:column;align-items:center;justify-content:center;gap:34px;color:#fff;background:radial-gradient(600px 400px at 50% 40%,#16305e,#060b18)}
#nl.show{display:flex;animation:pop .2s}
.gauge{position:relative;width:112px;height:112px;border-radius:50%;background:conic-gradient(#60a5fa var(--p,0%),rgba(255,255,255,.1) 0);display:flex;align-items:center;justify-content:center;box-shadow:0 0 30px rgba(59,130,246,.45)}
.gauge::after{content:"";position:absolute;inset:11px;border-radius:50%;background:#08101f;box-shadow:inset 0 0 14px rgba(0,0,0,.8)}
.gauge::before{content:"";position:absolute;inset:-12px;border-radius:50%;border:3px dashed rgba(147,197,253,.5);animation:spin2 4s linear infinite}
.gauge b{position:relative;z-index:1;font-size:26px;letter-spacing:1px;direction:ltr}
.nl-t{font-weight:800;font-size:14px;letter-spacing:.5px;color:#bcd0f5}
@keyframes spin2{to{transform:rotate(360deg)}}

/* ---- tablet / laptop ---- */
@media (min-width:700px) and (max-width:979px){main{max-width:880px}.tv-wrap{max-width:min(540px,calc(40vh*var(--r) + 24px))}}
@media (min-width:980px){
  header{padding-inline:max(12px,calc((100vw - 1600px)/2 + 32px))}
  main{display:grid;grid-template-columns:min(56vw,calc(62vh*var(--r) + 24px)) minmax(0,1fr);grid-template-rows:auto 1fr;gap:14px 28px;padding:12px 32px calc(100px + var(--safe-b));align-items:start;min-height:0}
  .stories{grid-column:1/-1;justify-content:flex-start;gap:18px}
  .tv-wrap{position:sticky;top:76px;max-width:none}
  .col{height:calc(100dvh - 260px);min-height:420px}
  .btn{padding:11px 22px;font-size:14px}.dock .btn{font-size:13px}.logo{font-size:20px}.clock{font-size:12px}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}
</style>
</head>
<body class="lock">

<div id="loader" aria-label="در حال بارگذاری">
  <div class="scene"><div class="cube"><div></div><div></div><div></div><div></div><div></div><div></div></div></div>
  <div class="track"><div class="fill" id="fill"></div></div><div id="pct">0%</div>
</div>

<script>
(function(){
  var C=CFG,B=C.btns,N=9,$=function(s){return document.querySelector(s)};
  var menu=$('#menu'),scrim=$('#scrim'),burger=$('#burger'),feed=$('#feed'),fsc=$('#fscroll'),sheet=$('#sheet'),clist=$('#clist'),cin=$('#cin'),sv=$('#sv'),nl=$('#nl'),grid=$('#grid');
  var v=$('#vid'),scr=$('.screen'),vfull=false,inView=true,splashOn=true,posts=[],sheetI=0;

  /* no pinch zoom */
  ['gesturestart','gesturechange','gestureend'].forEach(function(n){document.addEventListener(n,function(e){e.preventDefault()})});
  document.addEventListener('touchmove',function(e){if(e.touches.length>1)e.preventDefault()},{passive:false});

  function ld(k,d){try{var x=JSON.parse(localStorage.getItem(k));return x==null?d:x}catch(e){return d}}
  function sv_(k,x){try{localStorage.setItem(k,JSON.stringify(x))}catch(e){}}
  function safe(u){u=String(u||'').trim();return /^(javascript|data|vbscript):/i.test(u)?'#':u}
  function loadImg(img,src,i,onFail){
    img.onerror=function(){if(!img.dataset.d){img.dataset.d=1;img.src=DEMO[i%DEMO.length]}else if(onFail)onFail.call(img)};
    img.src=src;
  }

  /* ---------- back-button stack: every overlay is a layer, Back closes them one by one ---------- */
  var layers=[],noHist=false;
  function pushLayer(c){layers.push(c);try{history.pushState({L:layers.length},'')}catch(e){noHist=true}}
  function popLayer(){if(!layers.length)return;if(noHist){layers.pop()();return}history.back()}
  addEventListener('popstate',function(){var e=(history.state&&history.state.L)||0;while(layers.length>e)layers.pop()()});
  function showLayer(open,close){
    if(menu.classList.contains('show')){menuUI(false);layers[layers.length-1]=close;open()}
    else{open();pushLayer(close)}
  }
  document.addEventListener('keydown',function(e){if(e.key==='Escape')popLayer()});

  /* keeps scroll lock + video state in sync with whatever is open */
  function sync(){
    var modal=document.querySelector('.modal.show'),other=document.hidden||feed.classList.contains('show')||menu.classList.contains('show')||modal||sv.classList.contains('show')||nl.classList.contains('show');
    document.body.classList.toggle('lock',!!(splashOn||other||vfull));
    var q;
    if(vfull||(!other&&inView&&!splashOn)){q=v.play();if(q&&q.catch)q.catch(function(){})}else v.pause();
  }

  /* ---------- theme / title / clock ---------- */
  var root=document.documentElement,tb=$('#theme');
  function setTheme(t){root.setAttribute('data-theme',t);tb.textContent=t==='light'?'🌙':'☀️';try{localStorage.setItem('theme',t)}catch(e){}}
  var saved=null;try{saved=localStorage.getItem('theme')}catch(e){}
  setTheme(saved||'light');
  tb.onclick=function(){setTheme(root.getAttribute('data-theme')==='light'?'dark':'light')};
  $('#logo').textContent=C.title;document.title=C.title;$('#about-t').textContent=C.about;
  try{
    var dtf=new Intl.DateTimeFormat('fa-IR-u-ca-persian',{weekday:'long',day:'numeric',month:'long',year:'numeric'}),tf=new Intl.DateTimeFormat('fa-IR',{hour:'2-digit',minute:'2-digit'});
    var tick=function(){var d=new Date();$('#clock').textContent=dtf.format(d)+'  •  '+tf.format(d)};tick();setInterval(tick,15000);
  }catch(e){}

  /* ---------- button labels / links from settings ---------- */
  document.querySelectorAll('[data-k]').forEach(function(a){var b=B[a.dataset.k]||{};if(b.t)a.textContent=b.t;a.setAttribute('href',b.h?safe(b.h):'#')});
  function go(h,name){
    if(nl.classList.contains('show')||!h||h==='#')return;
    $('#nlt').textContent='در حال باز کردن «'+name+'»';nl.classList.add('show');sync();
    var t0=performance.now(),g=$('#gauge'),pb=$('#nlp');
    (function step(now){var p=Math.min(1,(now-t0)/2000);g.style.setProperty('--p',p*100+'%');pb.textContent=Math.round(p*100)+'%';if(p<1)requestAnimationFrame(step);else location.href=safe(h)})(t0);
  }
  addEventListener('pageshow',function(e){if(e.persisted){nl.classList.remove('show');sync()}});
  document.addEventListener('click',function(e){
    var p=e.target.closest&&e.target.closest('a[data-plan]');
    if(p){e.preventDefault();go((C.buyLink||'m.html')+'#buy-'+p.dataset.plan,p.dataset.name);return}
    var a=e.target.closest&&e.target.closest('a[data-k]');if(!a)return;e.preventDefault();
    var k=a.dataset.k,b=B[k]||{};
    if(!b.h&&k==='about')openModal('about');else if(!b.h&&k==='buy')openModal('buy');else go(b.h,b.t||a.textContent);
  });

  /* ---------- menu + modals ---------- */
  function menuUI(s){menu.classList.toggle('show',s);scrim.classList.toggle('show',s);burger.classList.toggle('open',s);burger.setAttribute('aria-expanded',s);sync()}
  burger.onclick=function(){if(menu.classList.contains('show'))popLayer();else{menuUI(true);pushLayer(function(){menuUI(false)})}};
  scrim.onclick=popLayer;
  function modalUI(id,s){$('#m-'+id).classList.toggle('show',s);sync()}
  function openModal(id){showLayer(function(){modalUI(id,true)},function(){modalUI(id,false)})}
  document.addEventListener('click',function(e){if(e.target.closest('[data-x]')||e.target.classList.contains('modal'))popLayer()});
  /* subscription plans: yearly price from settings, the rest divided from it */
  (function(){
    var P=+C.price||50000000,rd=function(x){return Math.round(x/1000)*1000},box=$('#plans');
    [['day','روزانه',rd(P/365),'هر روز'],['week','هفتگی',rd(P/52),'هر هفته'],['month','ماهانه',rd(P/12),'هر ماه'],['year','سالانه',P,'یک سال کامل']].forEach(function(p){
      var d=document.createElement('div');d.className='plan'+(p[0]==='year'?' best':'');
      d.innerHTML='<b></b><span class="pr"></span><small></small><a class="btn gold" href="#" data-plan="'+p[0]+'" data-name="اشتراک '+p[1]+'">خرید</a>';
      d.querySelector('b').textContent=p[1];d.querySelector('.pr').textContent=p[2].toLocaleString('fa-IR')+' تومان';d.querySelector('small').textContent=p[3];box.appendChild(d);
    });
  })();

  /* ---------- ads ---------- */
  var ads=(C.ads||[]).filter(function(a){return a&&a.t});
  function adNode(a){
    var el=document.createElement('a');el.className='ad';el.href=a.h?safe(a.h):'#';el.target='_blank';el.rel='noopener sponsored';
    var l=document.createElement('span');l.className='adl';l.textContent='تبلیغ';el.appendChild(l);
    if(a.i){var im=document.createElement('img');im.alt='';im.src=a.i;im.onerror=function(){im.remove()};el.appendChild(im)}
    var t=document.createElement('b');t.textContent=a.t;el.appendChild(t);return el;
  }
  if(ads.length){
    var ab=$('#adbox'),ai=0;ab.classList.add('show');
    var showAd=function(){ab.innerHTML='';ab.appendChild(adNode(ads[ai%ads.length]));ai++};showAd();if(ads.length>1)setInterval(showAd,6000);
  }

  /* ---------- explore grid + full-screen feed ---------- */
  var HEART='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>';
  var CHAT='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21.99 4c0-1.1-.89-2-1.99-2H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h14l4 4-.01-18z"/></svg>';
  var likes=ld('likes',{}),cms=ld('cms',{});
  function imgFail(){this.style.display='none';if(this.nextElementSibling)this.nextElementSibling.style.display='flex'}
  function paintPost(i){var p=posts[i];p.querySelector('.like').classList.toggle('on',!!likes[i]);p.querySelector('.lc').textContent=likes[i]?1:0;p.querySelector('.cc').textContent=(cms[i]||[]).length}
  function setLike(i,on){if(on)likes[i]=1;else delete likes[i];sv_('likes',likes);paintPost(i)}
  function burst(p){var b=p.querySelector('.burst');b.classList.remove('go');void b.offsetWidth;b.classList.add('go')}
  for(var i=0;i<N;i++)(function(i){
    var src=C.images[i]||'m'+(i+1)+'.png',b=document.createElement('button');
    b.className='tile';b.setAttribute('aria-label','باز کردن تصویر '+(i+1));
    b.innerHTML='<img alt="" loading="lazy"><span class="ph"></span>';b.querySelector('.ph').textContent=src;
    loadImg(b.querySelector('img'),src,i,imgFail);b.onclick=function(){openFeed(i)};grid.appendChild(b);
    var a=document.createElement('article');a.className='post';
    a.innerHTML='<img class="pbg" alt=""><img class="pimg" alt="تصویر '+(i+1)+'"><span class="pph"></span><div class="rail"><button class="act like" aria-label="پسندیدن"><span class="ic">'+HEART+'</span><b class="lc">0</b></button><button class="act cmt" aria-label="کامنت‌ها"><span class="ic">'+CHAT+'</span><b class="cc">0</b></button></div><span class="burst">'+HEART+'</span><div class="adbar"></div>';
    a.querySelector('.pph').textContent=src;
    loadImg(a.querySelector('.pbg'),src,i);
    loadImg(a.querySelector('.pimg'),src,i,function(){this.style.display='none';a.querySelector('.pbg').style.display='none';a.querySelector('.pph').style.display='flex'});
    if(ads.length)a.querySelector('.adbar').appendChild(adNode(ads[i%ads.length]));
    a.querySelector('.like').onclick=function(e){e.stopPropagation();setLike(i,!likes[i])};
    a.querySelector('.cmt').onclick=function(e){e.stopPropagation();openSheet(i)};
    var last=0;a.addEventListener('click',function(e){if(e.target.closest('.rail')||e.target.closest('.adbar'))return;var t=Date.now();if(t-last<320){setLike(i,true);burst(a);last=0}else last=t});
    fsc.appendChild(a);posts.push(a);paintPost(i);
  })(i);
  function curIdx(){return Math.max(0,Math.min(N-1,Math.round(fsc.scrollTop/(fsc.clientHeight||1))))}
  fsc.addEventListener('scroll',function(){$('#fcnt').textContent=(curIdx()+1)+' / '+N});
  function hideFeed(){feed.classList.remove('show');sheet.classList.remove('show');sync()}
  function openFeed(i){showLayer(function(){feed.classList.add('show')},hideFeed);sync();posts[i].scrollIntoView();$('#fcnt').textContent=(i+1)+' / '+N;fsc.focus({preventScroll:true})}
  $('#fback').onclick=popLayer;
  function renderC(){
    var a=cms[sheetI]||[];clist.innerHTML='';
    if(!a.length){var e=document.createElement('p');e.className='empty';e.textContent='هنوز کامنتی نیست. اولین نفر باش.';clist.appendChild(e)}
    a.forEach(function(t){var d=document.createElement('div');d.className='cm';d.textContent=t;clist.appendChild(d)});clist.scrollTop=clist.scrollHeight;
  }
  function openSheet(i){sheetI=i;renderC();sheet.classList.add('show');pushLayer(function(){sheet.classList.remove('show')})}
  function sendC(){var t=cin.value.trim();if(!t)return;(cms[sheetI]=cms[sheetI]||[]).push(t.slice(0,300));sv_('cms',cms);cin.value='';renderC();paintPost(sheetI)}
  $('#sclose').onclick=popLayer;$('#csend').onclick=sendC;
  sheet.addEventListener('click',function(e){if(e.target===sheet)popLayer()});
  cin.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();sendC()}});

  /* ---------- stories: each has a picture and a video ---------- */
  var seen=ld('seen',{}),sI=0,sS=0,sT=null,svv=$('#svv'),svi=$('#svi'),bars=sv.querySelectorAll('.sv-bars b');
  (C.stories||[]).forEach(function(st,k){
    var b=document.createElement('button');b.className='story'+(seen[k]?' seen':'');b.setAttribute('aria-label','استوری '+st.n);
    b.innerHTML='<span class="ring"><img alt=""></span><span class="sn"></span>';b.querySelector('.sn').textContent=st.n;
    loadImg(b.querySelector('img'),st.i||C.images[k]||'m'+(k+1)+'.png',k);
    b.onclick=function(){sI=k;sS=0;showLayer(function(){sv.classList.add('show')},storyHide);sync();storySlide(b)};$('#stories').appendChild(b);
  });
  function storyHide(){clearTimeout(sT);svv.pause();svv.removeAttribute('src');svv.load();sv.classList.remove('show');sync()}
  function bar(i,state,dur){var b=bars[i];b.style.transition='none';b.style.width=state==='done'?'100%':'0';if(state==='run'){void b.offsetWidth;b.style.transition='width '+dur+'s linear';b.style.width='100%'}}
  function storySlide(){
    var st=C.stories[sI],k=sI;clearTimeout(sT);$('#svn').textContent=st.n;seen[k]=1;sv_('seen',seen);
    var th=$('#stories').children[k];if(th)th.classList.add('seen');
    var hasV=!!(st.v||C.video);
    if(sS===0){
      svv.pause();svv.style.display='none';svi.style.display='block';loadImg(svi,st.i||C.images[k]||'m'+(k+1)+'.png',k);
      bar(0,'run',5);bar(1,'idle');sT=setTimeout(storyNext,5000);
    }else{
      svi.style.display='none';svv.style.display='block';bar(0,'done');bar(1,'idle');
      svv.onloadedmetadata=function(){var d=Math.min(svv.duration||15,30);bar(1,'run',d);clearTimeout(sT);sT=setTimeout(storyNext,d*1000+400)};
      svv.onended=storyNext;svv.onerror=function(){clearTimeout(sT);sT=setTimeout(storyNext,800)};
      svv.src=st.v||C.video;svv.muted=false;var q=svv.play();if(q&&q.catch)q.catch(function(){svv.muted=true;svv.play()});
    }
    if(!hasV&&sS===0){/* picture only */}
  }
  function storyNext(){var st=C.stories[sI];if(sS===0&&(st.v||C.video)){sS=1;storySlide()}else if(sI<C.stories.length-1){sI++;sS=0;storySlide()}else popLayer()}
  function storyPrev(){if(sS===1){sS=0;storySlide()}else if(sI>0){sI--;sS=0;storySlide()}else storySlide()}
  $('#svnext').onclick=storyNext;$('#svprev').onclick=storyPrev;$('#svx').onclick=popLayer;

  /* ---------- main video: tap = full screen, sound button, pauses when you leave it ---------- */
  v.src=C.video;v.volume=1;
  v.addEventListener('error',function(){var n=$('#noV');n.style.display='flex';n.textContent='فایل '+C.video+' پیدا نشد'});
  v.addEventListener('loadedmetadata',function(){
    if(v.videoWidth&&v.videoHeight){var r=Math.min(2.2,Math.max(1.6,v.videoWidth/v.videoHeight));scr.style.aspectRatio=r;root.style.setProperty('--r',r)}
  });
  var anchor=document.createElement('span');scr.parentNode.insertBefore(anchor,scr);
  function setFull(on){
    if(on===vfull)return;vfull=on;
    if(on){document.body.appendChild(scr);scr.classList.add('full')}else{anchor.parentNode.insertBefore(scr,anchor);scr.classList.remove('full')}
    sync();
  }
  scr.addEventListener('click',function(e){if(vfull||e.target.closest('#snd')||e.target.closest('#vback'))return;showLayer(function(){setFull(true)},function(){setFull(false)})});
  $('#vback').addEventListener('click',function(e){e.stopPropagation();popLayer()});
  var snd=$('#snd');
  function mark(){snd.textContent=v.muted?'🔇':'🔊'}
  function unmute(){v.muted=false;v.volume=1;var q=v.play();if(q&&q.catch)q.catch(function(){v.muted=true;v.play();mark()});mark()}
  snd.addEventListener('click',function(e){e.stopPropagation();if(v.muted)unmute();else{v.muted=true;mark()}});
  function once(e){document.removeEventListener('click',once);document.removeEventListener('keydown',once);if(e.target.closest&&e.target.closest('#snd'))return;if(v.muted)unmute()}
  document.addEventListener('click',once);document.addEventListener('keydown',once);
  if('IntersectionObserver' in window)new IntersectionObserver(function(en){inView=en[0].isIntersecting;sync()},{threshold:.2}).observe($('.tv'));
  document.addEventListener('visibilitychange',sync);addEventListener('pagehide',function(){v.pause()});

  /* ---------- broadcast message (comes back 12 hours after "got it") ---------- */
  function broadcast(){
    var b=C.bc;if(!b||!b.on||!b.m)return;
    var k='bc_'+b.id,t=0;try{t=+localStorage.getItem(k)||0}catch(e){}
    if(Date.now()-t<12*36e5)return;
    $('#bct').textContent=b.t||'پیام';$('#bcm').textContent=b.m;$('#bc').classList.add('show');
    $('#bcok').onclick=function(){try{localStorage.setItem(k,Date.now())}catch(e){}$('#bc').classList.remove('show')};
  }

  /* ---------- first-visit splash (not shown again on refresh) ---------- */
  function afterSplash(){splashOn=false;sync();broadcast()}
  var ld0=$('#loader');
  if(root.classList.contains('skip')){ld0.remove();afterSplash()}
  else{
    try{sessionStorage.setItem('seen','1')}catch(e){}
    var t0=Date.now(),fill=$('#fill'),pct=$('#pct'),iv=setInterval(function(){
      var p=Math.min(1,(Date.now()-t0)/1300),e=1-Math.pow(1-p,2);fill.style.width=e*100+'%';pct.textContent=Math.round(e*100)+'%';
      if(p>=1){clearInterval(iv);setTimeout(function(){ld0.classList.add('done');afterSplash()},250)}
    },40);
  }
})();
</script>
</body>
</html>
